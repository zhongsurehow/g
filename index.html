<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yin-Yang Five Elements Tarot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tarot-container">
        <h1>Yin-Yang Five Elements Tarot</h1>
        <p>Click the button below to draw a card and receive your guidance.</p>

        <button id="draw-card-btn">Draw a Card</button>

        <div id="card-display-container" class="hidden">
            <div class="card-flipper">
                <div class="card-face card-back">
                    <img src="https://via.placeholder.com/300x500/1a1a2e/FFFFFF?text=天人合一" alt="Card Back">
                </div>
                <div class="card-face card-front">
                    <h2 id="card-name"></h2>
                    <img id="card-image" src="" alt="Tarot Card Image">
                    <div id="card-interpretation">
                        <h3>Description:</h3>
                        <p id="card-description"></p>
                        <h4 id="upright-header">Upright Meaning:</h4>
                        <p id="upright-meaning"></p>
                        <h4 id="reversed-header">Reversed Meaning:</h4>
                        <p id="reversed-meaning"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
